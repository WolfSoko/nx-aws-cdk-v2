name: Release

on:
  release:
    types: [released]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install
        env:
          CI: true

      # npm >=11.5.1 is required for OIDC trusted publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Set Version
        run: npm --prefix ./packages/aws-cdk-v2 version ${{ github.ref_name }}

      - name: build
        run: npm run build:aws-cdk

      # Publishes via npm's OIDC trusted publishing (no NPM_TOKEN needed).
      # Requires this repo + workflow to be configured as a trusted publisher
      # for the package on npmjs.com.
      - name: deploy
        run: npm publish ./dist/packages/aws-cdk-v2 --access public
