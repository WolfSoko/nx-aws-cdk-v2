name: Release

# Runs once the CI workflow finishes successfully on main (i.e. lint, unit
# tests, build and e2e are all green). Nx Release inspects the Conventional
# Commits since the last release to decide whether a release is warranted,
# and if so versions the plugin, builds it, publishes it to npm via OIDC
# trusted publishing, and creates a GitHub release with generated notes -
# all in this one job. It is a no-op when nothing release-worthy has landed.
#
# Doing version, build and publish in a single job (rather than creating a
# GitHub release that a second workflow reacts to) is deliberate: GitHub does
# not start other workflow runs from events created by the default
# GITHUB_TOKEN, so a split flow would need a personal access token just to
# bridge the two workflows. Keeping it to one job needs only the default
# token.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read

jobs:
  release:
    name: Version, build & publish
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # needed for npm OIDC trusted publishing
    steps:
      # A plain branch checkout (not the triggering workflow_run's head_sha)
      # so HEAD is on main with an upstream to push the release commit and
      # tag to, rather than a detached HEAD.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      # OIDC trusted publishing requires npm >=11.5.1; pin to a known-good
      # major so a future npm release can't silently change publish behavior.
      - name: Update npm
        run: npm install -g "npm@>=11.5.1 <12"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, build, changelog & publish
        run: node tools/release.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Self-Healing CI: apply Nx Cloud's suggested fixes for failing tasks.
      # Learn more at https://nx.dev/ci/features/self-healing-ci
      - name: Self-Healing CI
        if: always()
        run: npx nx fix-ci
