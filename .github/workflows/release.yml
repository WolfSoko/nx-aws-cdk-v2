name: Release

# Runs once the CI workflow finishes successfully on main (i.e. lint, unit
# tests, build and e2e are all green). Nx Release inspects the Conventional
# Commits since the last release to decide whether a release is warranted,
# and if so versions the plugin, builds it, publishes it to npm via OIDC
# trusted publishing, and creates a GitHub release with generated notes -
# all in this one job. It is a no-op when nothing release-worthy has landed.
#
# Doing version, build and publish in a single job (rather than creating a
# GitHub release that a second workflow reacts to) is deliberate: GitHub does
# not start other workflow runs from events created by the default
# GITHUB_TOKEN, so a split flow would need a personal access token just to
# bridge the two workflows.
#
# A personal access token is needed here regardless, for a different reason:
# main has a ruleset requiring the CI status check, which a direct push -
# including this job's release commit - can never itself satisfy. The
# RELEASE_GH_TOKEN secret authenticates the push as the repo owner's account
# instead of the default GITHUB_TOKEN's GitHub Actions identity, so it can be
# added to the ruleset's bypass list (Settings -> Rules -> Rulesets) without
# granting a blanket bypass to the GitHub Actions app.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read

jobs:
  check:
    name: Check commit is still current
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      # No checkout needed: this only compares SHAs via the API. If main has
      # moved past the commit this CI run validated, skip - the workflow_run
      # triggered by whatever landed next will release that commit instead.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          if [ "$current_sha" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "main is now at $current_sha, past the validated ${{ github.event.workflow_run.head_sha }}; leaving this to the newer run."
          fi

  release:
    name: Version, build & publish
    needs: check
    if: needs.check.outputs.stale != 'true'
    runs-on: ubuntu-latest
    # Serialize releases: two CI runs finishing close together must not run
    # tools/release.js concurrently (racing commits/tags/publishes against
    # each other). Never cancel a release that's already in progress.
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write # needed for npm OIDC trusted publishing
    steps:
      # Pinned to the exact commit CI validated (not just "main"), so a
      # commit that landed after this CI run finished - and hasn't been
      # tested - never gets released. The token makes the later git push
      # authenticate as the repo owner's account (see the top-of-file
      # comment) rather than the default GITHUB_TOKEN.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      # OIDC trusted publishing requires npm >=11.5.1; pin to a known-good
      # major so a future npm release can't silently change publish behavior.
      - name: Update npm
        run: npm install -g "npm@>=11.5.1 <12"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, build, changelog & publish
        run: node tools/release.js
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
