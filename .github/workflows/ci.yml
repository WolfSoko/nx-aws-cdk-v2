name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    name: Lint, test, build & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # Distribute the affected tasks below across Nx Cloud's hosted agents
      # (the "linux-medium-js" launch template) - Nx Cloud provisions and
      # tears them down itself, no self-hosted runner job needed. Run this
      # as early as possible, before dependencies are installed.
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--legacy-peer-deps` is required: the Angular DevKit packages the Nx
      # devkit pulls in declare peer ranges that npm cannot satisfy strictly.
      - run: npm ci --legacy-peer-deps

      - uses: nrwl/nx-set-shas@v5

      - run: npx nx format:check

      # Nx Affected runs only tasks affected by the changes in this PR/commit.
      # `e2e-ci` atomizes the e2e suite into one task per spec file (see the
      # @nx/jest/plugin ciTargetName option in nx.json) so it distributes
      # across agents instead of running as one long task.
      # Learn more: https://nx.dev/ci/features/affected
      - run: npx nx affected -t lint test build e2e-ci

      # Self-Healing CI: apply Nx Cloud's suggested fixes for failing tasks.
      # Learn more at https://nx.dev/ci/features/self-healing-ci
      - name: Self-Healing CI
        if: always()
        run: npx nx fix-ci
