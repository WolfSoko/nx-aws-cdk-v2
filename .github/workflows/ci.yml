name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  main:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `--legacy-peer-deps` is required: the Angular DevKit packages the Nx
      # devkit pulls in declare peer ranges that npm cannot satisfy strictly.
      - run: npm ci --legacy-peer-deps

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check

      # Nx Affected runs only tasks affected by the changes in this PR/commit.
      # Learn more: https://nx.dev/ci/features/affected
      - run: npx nx affected -t lint test build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      # `e2e` depends on `aws-cdk-v2:build` (see nx.json targetDefaults), so the
      # plugin is rebuilt and installed into a throwaway workspace automatically.
      - run: npm run e2e:aws-cdk
