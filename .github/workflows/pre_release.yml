name: Pre-Release

on:
  release:
    types: [prereleased]

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url here: actions/setup-node writes an _authToken line to
      # .npmrc referencing NODE_AUTH_TOKEN whenever registry-url is set, even
      # though it's unused now. That placeholder makes npm think token auth is
      # already configured, so it skips the OIDC trusted-publishing handshake
      # (see actions/setup-node#1551). npm publishes to the default registry
      # (registry.npmjs.org) without it.
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install
        env:
          CI: true

      # OIDC trusted publishing requires npm >=11.5.1; pin to a known-good
      # major so a future npm release can't silently change publish behavior.
      - name: Update npm
        run: npm install -g "npm@>=11.5.1 <12"

      # --allow-same-version: `npm version X` exits 1 with "Version not changed"
      # when package.json already declares X. The checked-in version is kept in
      # sync with the released tag, so that is the normal case, not an error.
      # --no-git-tag-version: this is a detached checkout of the tag that gets
      # thrown away, so there is no point committing and tagging in it.
      - name: Set Version
        run: npm --prefix ./packages/aws-cdk-v2 version ${{ github.ref_name }} --allow-same-version --no-git-tag-version

      - name: build
        run: npm run build:aws-cdk

      # Publishes via npm's OIDC trusted publishing (no NPM_TOKEN needed).
      # Requires this repo + workflow to be configured as a trusted publisher
      # for the package on npmjs.com.
      - name: deploy
        run: npm publish ./dist/packages/aws-cdk-v2 --access public --tag beta
