name: Auto Release

# Runs once the CI workflow finishes successfully on main (i.e. lint, unit
# tests, build and e2e are all green) and creates a GitHub release when the
# commits since the last release warrant one. Creating the release is what
# triggers `release.yml` / `pre_release.yml`, which publish to npm.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      # semantic-release inspects the Conventional Commits since the last tag
      # to decide whether a release is warranted and, if so, what version it
      # gets, then creates the git tag and GitHub release via
      # @semantic-release/github (see .releaserc.json). It is a no-op when
      # nothing release-worthy has landed.
      #
      # A PAT is required here instead of the default GITHUB_TOKEN: GitHub
      # does not start other workflow runs (release.yml/pre_release.yml) from
      # events created by the default token, which would silently break npm
      # publishing. See:
      # https://docs.github.com/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: npx semantic-release
